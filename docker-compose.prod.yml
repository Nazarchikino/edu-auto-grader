services:
  db:
    image: postgres:16-alpine
    container_name: edu_auto_grader_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edu_grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-edu_auto_grader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edu_auto_grader_prod_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-edu_grader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-edu_auto_grader}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UPLOADS_DIR: /app/uploads
      SUBMISSION_FILE_RETENTION_DAYS: ${SUBMISSION_FILE_RETENTION_DAYS:-90}
      SUBMISSION_SUPERSEDED_GRACE_HOURS: ${SUBMISSION_SUPERSEDED_GRACE_HOURS:-24}
      ENABLE_RETENTION_CLEANUP_TASK: ${ENABLE_RETENTION_CLEANUP_TASK:-true}
      QUIZ_PASS_THRESHOLD_PERCENT: ${QUIZ_PASS_THRESHOLD_PERCENT:-70.0}
      QUIZ_RETRY_COOLDOWN_SECONDS: ${QUIZ_RETRY_COOLDOWN_SECONDS:-300}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: edu_auto_grader_prod_frontend
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - internal

networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
