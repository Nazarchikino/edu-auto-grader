[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-auto-grader-backend"
version = "0.1.0"
description = "Backend API and deterministic auto-grading engine for Word, Excel, Access, and HTML practicals"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "pyjwt==2.10.1",
    "bcrypt==4.2.0",
    "python-multipart==0.0.19",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "access-parser==0.0.6",
    "beautifulsoup4==4.12.3",
    "defusedxml==0.7.1",
    "lxml==5.3.0",
    "fpdf2==2.8.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.3",
    "mypy==1.13.0",
    "types-defusedxml==0.7.0.20260504",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "backend"

[[tool.mypy.overrides]]
module = ["fpdf", "fpdf.*", "bs4", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
