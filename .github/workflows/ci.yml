name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: edu_auto_grader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d edu_auto_grader_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_DB: edu_auto_grader_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies (mdbtools and DejaVu fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mdbtools fonts-dejavu-core

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Lint with Ruff
        run: ruff check backend

      - name: Typecheck backend/app with mypy --strict
        run: mypy --strict backend/app

      - name: Typecheck backend/tests with mypy --strict
        run: mypy --strict backend/tests

      - name: Run Alembic migrations and verify seed on PostgreSQL 16
        run: |
          alembic -c backend/alembic.ini upgrade head
          python -m app.seed --dry-run
          python -m app.seed
          python -m app.seed --sync-courses

      - name: Run pytest test suite
        run: pytest -c backend/pyproject.toml

  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck TypeScript
        run: npm --prefix frontend run typecheck

      - name: Lint with ESLint
        run: npm --prefix frontend run lint

      - name: Build production bundle
        run: npm --prefix frontend run build
